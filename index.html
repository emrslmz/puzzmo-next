<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1a3a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="format-detection" content="telephone=no" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' capacitor: https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' capacitor: http: https: ws: wss: data: blob:; frame-src https:;" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preload" href="/assets/fonts/LilitaOne-Regular.ttf" as="font" type="font/ttf" crossorigin />
  <title>Puzzmo</title>
  <style>
    @font-face {
      font-family: 'Lilita One';
      src: url('/assets/fonts/LilitaOne-Regular.ttf') format('truetype');
      font-display: block;
    }
    @font-face {
      font-family: 'Luckiest Guy';
      src: url('/assets/fonts/LuckiestGuy-Regular.ttf') format('truetype');
      font-display: block;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1a3a;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    #game canvas {
      display: block;
    }
    /* Safe-area probe: read by the game to keep HUD clear of notches. */
    #safe-area-probe {
      position: fixed;
      inset: 0;
      pointer-events: none;
      visibility: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(ellipse at 50% 40%, #2a6fdb 0%, #123a8a 55%, #0b1a3a 100%);
      color: #fff;
      font-family: 'Lilita One', system-ui, sans-serif;
      z-index: 5;
      transition: opacity .35s ease;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
    #boot .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 5px solid rgba(255, 255, 255, .25);
      border-top-color: #ffd34d;
      animation: spin .8s linear infinite;
    }
    #rotate {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0b1a3a;
      color: #fff;
      font: 22px 'Lilita One', system-ui, sans-serif;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }
    #rotate .phone {
      width: 64px;
      height: 108px;
      border: 6px solid #ffd34d;
      border-radius: 14px;
      animation: rotate-hint 2s ease-in-out infinite;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rotate-hint {
      0%, 20% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="safe-area-probe"></div>
  <div id="boot"><div class="spinner"></div></div>
  <div id="rotate">
    <div class="phone"></div>
    <div id="rotate-text">Please rotate your device</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
